<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Workforce{% endblock %}</title>
  <style>
    :root { --ink:#1d2330; --muted:#6b7280; --line:#e5e7eb; --bg:#f7f8fa; --brand:#1f4e79; --ok:#166534; --warn:#92400e; --bad:#991b1b; }
    * { box-sizing:border-box; }
    body { margin:0; font:15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color:var(--ink); background:var(--bg); }
    header { background:var(--brand); color:#fff; }
    header .wrap { display:flex; gap:1.5rem; align-items:center; }
    header a { color:#fff; text-decoration:none; opacity:.9; }
    header a:hover { opacity:1; text-decoration:underline; }
    header .brand { font-weight:700; margin-right:auto; }
    .wrap { max-width:1100px; margin:0 auto; padding:1rem 1.25rem; }
    .card { background:#fff; border:1px solid var(--line); border-radius:8px; padding:1rem 1.25rem; margin-bottom:1rem; }
    .grid { display:grid; gap:1rem; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); }
    h1 { font-size:1.5rem; margin:.5rem 0 1rem; } h2 { font-size:1.1rem; margin:0 0 .75rem; }
    table { width:100%; border-collapse:collapse; } th, td { text-align:left; padding:.45rem .5rem; border-bottom:1px solid var(--line); vertical-align:top; }
    th { font-size:.8rem; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); }
    .num { text-align:right; font-variant-numeric:tabular-nums; }
    .pill { display:inline-block; padding:.05rem .5rem; border-radius:99px; font-size:.8rem; background:#eef2f7; }
    .pill.approved { background:#dcfce7; color:var(--ok); } .pill.pending, .pill.submitted { background:#fef3c7; color:var(--warn); }
    .pill.rejected { background:#fee2e2; color:var(--bad); } .pill.cancelled { background:#f3f4f6; color:var(--muted); }
    .muted { color:var(--muted); } .big { font-size:1.8rem; font-weight:700; }
    form p { margin:.5rem 0; } label { display:block; font-weight:600; font-size:.9rem; }
    input, select, textarea { font:inherit; padding:.35rem .5rem; border:1px solid #cbd5e1; border-radius:6px; max-width:100%; }
    button, .btn { font:inherit; padding:.4rem .9rem; border-radius:6px; border:1px solid var(--brand); background:var(--brand); color:#fff; cursor:pointer; text-decoration:none; display:inline-block; }
    button.secondary, .btn.secondary { background:#fff; color:var(--brand); } button.danger { background:var(--bad); border-color:var(--bad); }
    .messages { list-style:none; padding:0; } .messages li { padding:.6rem .9rem; border-radius:6px; margin-bottom:.5rem; background:#e0f2fe; }
    .messages .error { background:#fee2e2; } .messages .success { background:#dcfce7; }
    .errorlist { color:var(--bad); padding-left:1rem; }
    .ts input[type=text] { width:4.2rem; text-align:right; }
    .ts th.weekend, .ts td.weekend { background:#f8fafc; } .ts th.holiday, .ts td.holiday { background:#fff7ed; }
  </style>
</head>
<body>
<header><div class="wrap">
  <a class="brand" href="{% url 'dashboard' %}">Workforce</a>
  {% if user.is_authenticated %}
    <a href="{% url 'timesheets:week' %}">Timesheet</a>
    <a href="{% url 'leave:mine' %}">Leave</a>
    <a href="{% url 'leave:team' %}">Team leave</a>
    <a href="{% url 'leave:approvals' %}">Approvals</a>
    {% if user.is_staff %}<a href="{% url 'admin:index' %}">Admin</a>{% endif %}
    <form method="post" action="{% url 'logout' %}" style="margin:0">{% csrf_token %}<button class="secondary" style="padding:.2rem .6rem">Log out</button></form>
  {% endif %}
</div></header>
<main class="wrap">
  {% if messages %}<ul class="messages">{% for m in messages %}<li class="{{ m.tags }}">{{ m }}</li>{% endfor %}</ul>{% endif %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
